<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Story Teller</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet" href="../assets/css/style.css">

<link rel="stylesheet" href="../assets/css/auth.css">


</head>


<body>


<header>


<nav class="navbar">


<div class="logo">

📖 Story Teller

</div>



<ul class="nav-links">


<li>
<a href="index.html">
Home
</a>
</li>


<li>
<a href="stories.html">
Stories
</a>
</li>


<li>
<a href="about.html">
About
</a>
</li>


</ul>



<div class="nav-right">


<button id="theme-toggle" class="theme-btn">

🌙

</button>


</div>


</nav>


</header>





<section class="auth-page">


<div class="auth-box">


<h1>

Welcome Back

</h1>



<p>

Continue your magical journey.

</p>



<form id="loginForm">


<div class="input-group">


<label>

Email

</label>


<input
type="email"
placeholder="Enter your email"
required>


</div>





<div class="input-group">


<label>

Password

</label>


<input
type="password"
placeholder="Enter your password"
required>


</div>





<div class="options">


<label>


<input type="checkbox">


Remember Me


</label>



<a href="#">

Forgot Password?

</a>


</div>





<button class="auth-btn">

Login

</button>



</form>





<div class="divider">


<span>

OR

</span>


</div>





<button
type="button"
class="google-btn"
id="googleLoginBtn">

🌈 Continue with Google

</button>





<p class="switch">


Don't have an account?


<a href="signup.html">

Create Account

</a>


</p>



</div>


</section>





<footer>


<p>

© 2026 Story Teller | Every Story Begins with a Single Click.

</p>


</footer>





<script>


// DARK MODE


const themeBtn=document.getElementById("theme-toggle");



if(localStorage.getItem("theme")==="dark"){


document.body.classList.add("dark");

themeBtn.innerHTML="☀️";


}



themeBtn.onclick=function(){


document.body.classList.toggle("dark");



if(document.body.classList.contains("dark")){


localStorage.setItem("theme","dark");

themeBtn.innerHTML="☀️";


}

else{


localStorage.setItem("theme","light");

themeBtn.innerHTML="🌙";


}


};





// LOGIN SYSTEM


document.getElementById("loginForm").onsubmit=function(e){


e.preventDefault();





/* ===============================
        GET LOGIN DETAILS
================================== */


const email =
document.querySelector('input[type="email"]').value.trim().toLowerCase();


const password =
document.querySelector('input[type="password"]').value;





/* ===============================
        GET ALL USERS
================================== */


let users =
JSON.parse(
localStorage.getItem("users")
) || [];





/* ===============================
        FIND USER
================================== */


const user =
users.find(
account =>
account.email === email &&
account.password === password
);





/* ===============================
        LOGIN SUCCESS
================================== */


if(user){


/* Save CURRENT logged-in user */


localStorage.setItem(
"userName",
user.name
);


localStorage.setItem(
"userEmail",
user.email
);


localStorage.setItem(
"loggedIn",
"true"
);


alert(
"Welcome back, " +
user.name +
"! 📖✨"
);


window.location.href =
"profile.html";


}





/* ===============================
        LOGIN FAILED
================================== */


else{


alert(
"Incorrect Email or Password!"
);


}


};





// GOOGLE LOGIN BUTTON


document.getElementById("googleLoginBtn").onclick=function(){


alert(
"🌈 Google Login is not connected yet.\n\n" +
"Please use your Email & Password to login."
);


};


</script>


</body>

</html>
