<!-- ================= READING HISTORY ================= -->

<script>

const storyTitleElement =
    document.getElementById("storyTitle");


if(storyTitleElement){

    const storyName =
        storyTitleElement.innerText;


    const userEmail =
        localStorage.getItem("userEmail");


    if(
        userEmail &&
        storyName &&
        storyName !== "Loading Story..."
    ){


        /* ===============================
                STORIES READ
        ================================ */


        const storiesReadKey =
            "storiesRead_" + userEmail;


        let readStories =
            JSON.parse(
                localStorage.getItem(storiesReadKey)
            ) || [];


        if(!readStories.includes(storyName)){


            readStories.push(storyName);


            localStorage.setItem(
                storiesReadKey,
                JSON.stringify(readStories)
            );


        }



        /* ===============================
                READING HISTORY
        ================================ */


        const historyKey =
            "readingHistory_" + userEmail;


        let readingHistory =
            JSON.parse(
                localStorage.getItem(historyKey)
            ) || [];


        if(!readingHistory.includes(storyName)){


            readingHistory.push(storyName);


            localStorage.setItem(
                historyKey,
                JSON.stringify(readingHistory)
            );


        }

    }

}

</script>



<!-- ================= FONT PREFERENCE ================= -->

<script>

const savedFont =
    localStorage.getItem("readingFont");


const storyContentElement =
    document.getElementById("storyContent");


if(savedFont && storyContentElement){


    const fontMap = {


        poppins:
            '"Poppins", sans-serif',


        merriweather:
            '"Merriweather", serif',


        playfair:
            '"Playfair Display", serif',


        nunito:
            '"Nunito", sans-serif',


        comic:
            '"Comic Neue", cursive',


        caveat:
            '"Caveat", cursive',


        cinzel:
            '"Cinzel", serif',


        roboto:
            '"Roboto", sans-serif'


    };


    const selectedFont =
        fontMap[savedFont];


    if(selectedFont){


        storyContentElement.style.setProperty(
            "font-family",
            selectedFont,
            "important"
        );


        const storyElements =
            storyContentElement.querySelectorAll("*");


        storyElements.forEach(element => {


            element.style.setProperty(
                "font-family",
                selectedFont,
                "important"
            );


        });


    }

}

</script>
